name: Position chart completion tests
on:
  push:
    paths: ['admin-position-charts.*','admin-positions.html','member-trade-history.js','supabase/functions/**','supabase/migrations/*position_chart*','tests/**','scripts/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest tests/ -q
      - run: node --test tests/position-charts.test.mjs
      - run: node tests/admin-position-charts.test.cjs && node tests/member-chart-upload.test.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-config supabase/functions/position-chart-admin/index.ts supabase/functions/position-chart-media/index.ts supabase/functions/position-chart-reminder/index.ts
      - run: deno test --no-config --allow-env --allow-net tests/position-charts-http.test.ts
